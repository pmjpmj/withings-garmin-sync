name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        id: fmt
        run: cargo fmt --check
        continue-on-error: true

      - name: Run clippy
        id: clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

      - name: Run tests
        id: tests
        run: cargo test --locked

      - name: Summarize check results
        if: always()
        env:
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          failed=0
          for check in fmt clippy tests; do
            outcome_var="${check^^}_OUTCOME"
            outcome="${!outcome_var}"
            if [ "$outcome" != success ]; then
              echo "::error::${check} check ${outcome}"
              failed=1
            fi
          done
          exit "$failed"
